server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/html text/css application/javascript image/svg+xml;

    # Die Karte ist eine einzelne HTML-Datei mit den Daten im Quelltext.
    # Nicht cachen, damit eine erweiterte Datenbasis sofort ankommt.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 = /index.html;

    access_log off;
}
