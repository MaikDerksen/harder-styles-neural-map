<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interaktive Netzwerkkarte der Harder-Styles-Szene in NL, BE und DE: Acts, Festivals, Kollaborationen, Labels und B2B-Sets.">
<style>:root{color-scheme:dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Harder Styles Neural Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0C0814; --ground-2:#120C1D; --surface:#1A1228; --surface-2:#221733;
  --line:#31234A; --line-2:#40305C;
  --ink:#F0EAF7; --ink-2:#B4A6C8; --ink-3:#7B6C91;
  --hot:#FF2E6B;
  --c-collab:#FF2E6B; --c-crew:#FFFFFF; --c-label:#FFC24B; --c-b2b:#8B6BFF;
  --c-audience:#7FA6C4; --c-plays:#6C5A8C;
  --font-display:"Big Shoulders Display","Haettenschweiler","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input{font:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 428px;height:100dvh;min-height:600px}
.stage{position:relative;min-width:0;background:radial-gradient(1200px 780px at 44% 46%,#1C1230 0%,#110B1D 48%,var(--ground) 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---- top bar over canvas ---- */
.top{position:absolute;top:16px;left:18px;right:18px;display:flex;gap:14px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.brand{pointer-events:none;flex:none}
.brand h1{font-family:var(--font-display);font-weight:900;font-size:clamp(22px,2.5vw,34px);line-height:.85;margin:0;text-transform:uppercase}
.brand h1 em{font-style:normal;color:var(--hot)}
.brand .bpm{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.searchwrap{pointer-events:auto;position:relative;margin-left:auto;width:min(320px,42vw)}
.searchwrap input{
  width:100%;background:rgba(18,12,29,.9);border:1px solid var(--line);border-radius:2px;
  padding:9px 12px;color:var(--ink);font-size:13px;backdrop-filter:blur(8px);
}
.searchwrap input::placeholder{color:var(--ink-3)}
.sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--ground-2);border:1px solid var(--line);border-radius:2px;max-height:320px;overflow-y:auto;z-index:9}
.sugg button{display:block;width:100%;padding:8px 12px;font-size:13px;border-bottom:1px solid rgba(49,35,74,.6)}
.sugg button:hover,.sugg button.sel{background:var(--surface);color:#fff}
.sugg .k{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}

/* ---- path ---- */
.path{position:absolute;left:18px;right:18px;bottom:96px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:var(--font-mono);font-size:11px;pointer-events:auto}
.path .plabel{color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;margin-right:2px}
.path button{border:1px solid var(--line);background:rgba(18,12,29,.85);padding:3px 9px;border-radius:2px;color:var(--ink-2);backdrop-filter:blur(6px)}
.path button:hover{color:var(--ink);border-color:var(--hot)}
.path button.now{color:#12060D;background:var(--hot);border-color:var(--hot);font-weight:600}
.path .sep{color:var(--ink-3)}
.path .reset{margin-left:auto}

/* ---- filter rail ---- */
.rail{position:absolute;left:18px;right:18px;bottom:14px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;pointer-events:auto}
.f{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:2px;
  border:1px solid var(--line);background:rgba(16,11,26,.86);backdrop-filter:blur(8px);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase;
  transition:opacity .14s,border-color .14s,color .14s;
}
.f:hover{color:var(--ink)}
.f.off{opacity:.32}
.f .dot{width:8px;height:8px;border-radius:50%;flex:none}
.f .ln{width:14px;height:0;border-top-width:2px;border-top-style:solid;flex:none}
.f[data-e="audience"] .ln{border-top-style:dashed}
.f.grp{border-color:transparent;background:none;color:var(--ink-3);letter-spacing:.16em;padding-left:0;padding-right:2px}

/* ---- panel ---- */
.panel{background:var(--ground-2);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.panel::-webkit-scrollbar{width:9px}
.panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.pad{padding:18px 20px}
.sect{border-bottom:1px solid var(--line)}
.sect h3{font-family:var(--font-mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);margin:0 0 11px;font-weight:500;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.sect h3 .cnt{letter-spacing:.08em}
.sect h3 .cnt{color:var(--ink-2);font-size:10px}
.p-head{border-bottom:1px solid var(--line);padding:20px 20px 16px}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.p-name{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(26px,3vw,38px);line-height:.9;margin:7px 0 0}
.p-aka{color:var(--ink-2);font-size:12.5px;margin:6px 0 0}
.chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.chip{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:3px 8px;border-radius:2px;color:var(--ink-2)}
.chip.solid{background:var(--hot);border-color:var(--hot);color:#12060D;font-weight:600}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:1px}
.bio{margin:0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.tracks{list-style:none;margin:0;padding:0}
.tracks li{display:grid;gap:2px;padding:7px 0;border-bottom:1px dotted rgba(49,35,74,.7)}
.tracks li:last-child{border-bottom:0}
.tracks .tt{color:var(--ink);font-weight:500;font-size:13px}
.tracks .tw{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);line-height:1.45}

.conns{display:flex;flex-direction:column;gap:1px}
.conn{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:3px 9px;align-items:center;width:100%;padding:8px 9px;border-radius:3px;border:1px solid transparent;transition:background .12s,border-color .12s}
.conn:hover,.conn:focus-visible{background:var(--surface);border-color:var(--line)}
.conn .bar{grid-column:1;grid-row:1/3;align-self:stretch;border-radius:2px}
.conn .who{grid-column:2;grid-row:1;font-weight:600;font-size:13.5px}
.conn .meta{grid-column:2;grid-row:2;color:var(--ink-2);font-size:11.5px;line-height:1.35}
.conn .str{grid-column:3;grid-row:1/3;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.conn .ttype{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
.conn .mine{color:var(--hot);font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;border:1px solid currentColor;padding:1px 4px;border-radius:2px;margin-left:6px;vertical-align:2px}

.rec{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 11px;width:100%;padding:10px 9px;border-radius:3px;border:1px solid transparent;align-items:center;transition:background .12s,border-color .12s}
.rec:hover,.rec:focus-visible{background:var(--surface);border-color:var(--line)}
.rec .rank{grid-column:1;grid-row:1/3;font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rec .who{grid-column:2;grid-row:1;font-weight:600;font-size:14px}
.rec .why{grid-column:2;grid-row:2;color:var(--ink-2);font-size:11.5px}
.rec .score{grid-column:3;grid-row:1/3;font-family:var(--font-mono);font-size:11px;color:var(--hot);font-variant-numeric:tabular-nums}

.mine-list{display:flex;flex-wrap:wrap;gap:5px}
.mine-list .m{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:2px;background:var(--surface);overflow:hidden}
.mine-list .m span{padding:5px 4px 5px 10px;font-size:12.5px;font-weight:500}
.mine-list .m b{width:7px;height:7px;border-radius:50%;background:var(--hot);margin-left:9px;flex:none}
.mine-list .m button{padding:5px 9px 5px 6px;color:var(--ink-3);font-family:var(--font-mono)}
.mine-list .m button:hover{color:var(--hot)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:7px 10px;color:var(--ink);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:2px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--hot);color:var(--ink)}
.btn.pri{background:var(--hot);border-color:var(--hot);color:#12060D;font-weight:600}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

.note{border-left:2px solid var(--c-label);background:rgba(255,194,75,.05);padding:11px 13px;color:var(--ink-2);font-size:12.5px}
.note strong{color:var(--c-label);font-weight:600}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);padding:6px 10px;border-radius:2px;text-decoration:none}
.links a:hover{color:var(--ink);border-color:var(--hot)}
.foot{color:var(--ink-3);font-size:11.5px;line-height:1.55}

.lineup{display:flex;flex-wrap:wrap;gap:4px}
.lineup button{border:1px solid var(--line);padding:4px 8px;border-radius:2px;font-size:12px;color:var(--ink-2);transition:border-color .12s,color .12s}
.lineup button:hover{color:var(--ink);border-color:var(--hot)}
.lineup button.is-mine{border-color:var(--hot);color:var(--ink)}
.lineup button .g{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td{padding:6px 0;border-bottom:1px dotted rgba(49,35,74,.7);vertical-align:top}
.tbl td.n{font-family:var(--font-mono);font-size:11px;color:var(--hot);text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.tbl button{font-weight:500}
.tbl button:hover{color:#fff}
.tbl .sub{display:block;color:var(--ink-3);font-size:11px;font-family:var(--font-mono);margin-top:1px}

.fdir{display:grid;gap:0}
.fdir .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px dotted rgba(49,35,74,.7)}
.fdir .row .nm{font-weight:600;font-size:13px}
.fdir .row .sub{grid-column:1;color:var(--ink-3);font-size:11.5px;font-family:var(--font-mono)}
.fdir .row .tag{grid-column:2;grid-row:1/3;align-self:center;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;white-space:nowrap}
.fdir .row.live .nm{color:var(--ink)}
.fdir .row.live .tag{color:var(--hot)}

.tip{position:absolute;pointer-events:none;z-index:5;background:rgba(12,8,20,.95);border:1px solid var(--line);border-radius:3px;padding:7px 10px;max-width:260px;font-size:12px;color:var(--ink-2);backdrop-filter:blur(6px);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;color:var(--ink);font-size:13px;font-weight:600;margin-bottom:2px}

@media (max-width:960px){
  .app{grid-template-columns:1fr;grid-template-rows:60svh auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .brand h1{font-size:20px}
  .searchwrap{width:100%;margin-left:0}
  .path{bottom:80px}
  .rail{gap:4px}
  .f{font-size:9.5px;padding:3px 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

function key(s){ return s.toLowerCase().replace(/[.’'!\-\s]/g,""); }
function clean(raw){
  var s = raw.replace(/\s+/g," ").trim();
  s = s.replace(/\s+pres\.?\s.*$/i,"").replace(/\s+presents\s.*$/i,"");
  s = s.replace(/:.*$/,"");
  s = s.replace(/\s+LIVE$/i,"").replace(/\s+\(Live\)$/i,"");
  return s.trim();
}
function splitSet(raw){
  var s = clean(raw);
  if(NOSPLIT[key(s)]) return [s];
  var parts = s.split(/\s+(?:vs\.?|x)\s+|\s+&\s+/i);
  var out=[], i;
  for(i=0;i<parts.length;i++){
    var p=parts[i].trim();
    if(p && !NOSPLIT[key(p)]) out.push(p);
    else if(p) out.push(p);
  }
  return out.filter(function(p){return p.length>0;});
}

var byKey={}, NODES=[], EDGES=[];
function node(name, kind){
  var k = key(name);
  if(ALIAS[k]){ name = ALIAS[k]; k = key(name); }
  if(byKey[k]) return byKey[k];
  var nd = {id:k, name:name, kind:kind||"artist", edges:[], fests:[], deg:0,
            x:0,y:0,vx:0,vy:0,r:6,alpha:1,depth:1,ta:null};
  byKey[k]=nd; NODES.push(nd);
  return nd;
}
function edge(a,b,type,w,ev){
  if(!a||!b||a===b) return null;
  var e={a:a,b:b,type:type,w:w,ev:ev,p:Math.random()};
  EDGES.push(e); a.edges.push(e); b.edges.push(e);
  var m = TYPES[type].w*w;
  a.deg+=m; b.deg+=m;
  return e;
}
function findEdge(a,b,type){
  for(var i=0;i<a.edges.length;i++){
    var e=a.edges[i];
    if(e.type===type && (e.a===b||e.b===b)) return e;
  }
  return null;
}

    var stageName = pair[0], entries = pair[1];
    entries.forEach(function(raw){
      if(DROP[key(clean(raw))]) return;
      var members = splitSet(raw).filter(function(m){return !DROP[key(m)];});
      var nodes = members.map(function(m){return node(m,"artist");});
      nodes.forEach(function(nd){
        if(fn.acts.indexOf(nd)<0) fn.acts.push(nd);
        if(nd.fests.indexOf(fn)<0) nd.fests.push(fn);
        var ex = findEdge(nd,fn,"plays");

        else { var pe=edge(nd,fn,"plays",1,f.n); pe.stages=[stageName]; }
      });
      if(nodes.length>1){
        for(var i=0;i<nodes.length;i++) for(var j=i+1;j<nodes.length;j++){
          var ex2=findEdge(nodes[i],nodes[j],"b2b");
          if(ex2){ ex2.w=Math.min(5,ex2.w+1); ex2.sets.push(f.n+" · "+stageName); ex2.ev=ex2.sets.length+"× gemeinsames Set: "+ex2.sets.join(", "); }

function score(){
  var seeds = MINE.map(function(k){return byKey[k];}).filter(Boolean);
  ARTISTS.forEach(function(nd){
    nd.score=0; nd.via=[];
    if(!seeds.length || isMine(nd)) return;
    var via={};
    nd.edges.forEach(function(e){
      if(e.type==="plays") return;
      var o = e.a===nd?e.b:e.a;
      if(!isMine(o)) return;
      var v = e.w*TYPES[e.type].w;
      nd.score+=v;
      via[o.name]=Math.max(via[o.name]||0,v);
    });
    seeds.forEach(function(s){
      var sf=sharedFests(nd,s);
      if(sf>0){ nd.score += Math.min(sf,4)*0.45; via[s.name]=(via[s.name]||0)+0.3; }
    });
    nd.score=Math.round(nd.score*10)/10;
    nd.via=Object.keys(via).sort(function(x,y){return via[y]-via[x];});
  });
  RECS = ARTISTS.filter(function(n){return !isMine(n) && n.score>0;})
                .sort(function(x,y){return y.score-x.score;});
}

function computeDepth(){
  computeVis();
  NODES.forEach(function(nd){ nd.depth = focus?3:1; nd.ta=null; });
  if(!focus){ focusRing=0; return; }
  focus.depth=0;
  focus.edges.forEach(function(e){
    if(!edgeVisible(e)) return;
    var o=e.a===focus?e.b:e.a;
    if(nodeVisible(o)) o.depth=Math.min(o.depth,1);
  });
  var ring=NODES.filter(function(nd){return nd.depth===1;});
  if(ring.length>46){
    ring.sort(function(x,y){
      var ex=findBest(focus,x), ey=findBest(focus,y);
      return ey-ex || y.deg-x.deg;
    });
    ring.slice(46).forEach(function(nd){ nd.depth=2; });
    ring=ring.slice(0,46);
  }
  NODES.forEach(function(nd){
    if(nd.depth!==1) return;
    nd.edges.forEach(function(e){
      if(!edgeVisible(e)) return;
      var o=e.a===nd?e.b:e.a;
      if(o.depth>1 && nodeVisible(o)) o.depth=2;
    });
  });
  ring.sort(function(x,y){
    var c=(x.kind==="fest"?-1:0)-(y.kind==="fest"?-1:0);
    if(c!==0) return c;
    var gx=GKEYS.indexOf(x.g), gy=GKEYS.indexOf(y.g);
    return gx-gy || y.deg-x.deg;
  });
  focusRing=ring.length;
  ring.forEach(function(nd,i){ nd.ta = -Math.PI/2 + (i/ring.length)*Math.PI*2; });
}
function findBest(a,b){
  var best=0;
  for(var i=0;i<a.edges.length;i++){
    var e=a.edges[i];
    if(e.a===b||e.b===b){ var v=e.w*TYPES[e.type].w; if(v>best) best=v; }
  }
  return best;
}

function tick(){
  var cx=W/2, cy=H/2, i, j;
  var ring1=Math.min(Math.max(150, 76+focusRing*8.5), Math.min(W,H)*0.38);
  var rings=[0, ring1, ring1+130, ring1+265];
  var vis=VIS;

  for(i=0;i<vis.length;i++){
    var a=vis[i];
    for(j=i+1;j<vis.length;j++){
      var b=vis[j];
      var dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2>160000) continue;
      if(d2<0.05){ dx=Math.random()-.5; dy=Math.random()-.5; d2=1; }
      var d=Math.sqrt(d2);
      var minD=(a.r+b.r)*1.8+(focus?16:26);
      var f=(focus?1600:4200)*a.mass*b.mass/d2;
      if(d<minD) f+=(minD-d)*2.6;
      var ux=dx/d, uy=dy/d;
      a.vx-=ux*f*0.018/a.mass; a.vy-=uy*f*0.018/a.mass;
      b.vx+=ux*f*0.018/b.mass; b.vy+=uy*f*0.018/b.mass;
    }
  }
  for(i=0;i<EDGES.length;i++){
    var e=EDGES[i];
    if(!e.a.vis||!e.b.vis||!eFilter[e.type]) continue;
    var ea=e.a, eb=e.b;
    var dx2=eb.x-ea.x, dy2=eb.y-ea.y, dd=Math.sqrt(dx2*dx2+dy2*dy2)||1;
    var rest = focus?150:(e.type==="plays"?115:190-e.w*12);
    var k = (focus?0.0008:0.0022)*(e.type==="plays"?0.9:1)*(e.type==="audience"?0.4:1);
    var ff=(dd-rest)*k;
    ea.vx+=dx2/dd*ff/ea.mass; ea.vy+=dy2/dd*ff/ea.mass;
    eb.vx-=dx2/dd*ff/eb.mass; eb.vy-=dy2/dd*ff/eb.mass;
  }
  for(i=0;i<NODES.length;i++){
    var nd=NODES[i];
    if(focus){
      if(nd===focus){ nd.vx+=(cx-nd.x)*0.17; nd.vy+=(cy-nd.y)*0.17; }
      else if(nd.depth===1 && nd.ta!=null){
        var tx=cx+Math.cos(nd.ta)*ring1, ty=cy+Math.sin(nd.ta)*ring1*0.93;
        nd.vx+=(tx-nd.x)*0.05; nd.vy+=(ty-nd.y)*0.05;
      }else{
        var want=rings[Math.min(nd.depth,3)];
        var ddx=nd.x-cx, ddy=nd.y-cy, dr=Math.sqrt(ddx*ddx+ddy*ddy)||1;
        var fr=(want-dr)*0.04;
        nd.vx+=ddx/dr*fr; nd.vy+=ddy/dr*fr;
      }
    }else if(nd.kind==="fest"){
      nd.vx+=(W*nd.ax-nd.x)*0.06; nd.vy+=(H*nd.ay-nd.y)*0.06;
    }else{
      if(nd.fests.length){
        var sx=0,sy=0;
        for(var q=0;q<nd.fests.length;q++){ sx+=nd.fests[q].x; sy+=nd.fests[q].y; }
        sx/=nd.fests.length; sy/=nd.fests.length;
        nd.vx+=(sx-nd.x)*0.011; nd.vy+=(sy-nd.y)*0.011;
      }else{
        nd.vx+=(cx-nd.x)*0.008; nd.vy+=(cy-nd.y)*0.008;
      }
    }
    nd.vx*=0.79; nd.vy*=0.79;
    var sp=Math.hypot(nd.vx,nd.vy);
    if(sp>22){ nd.vx*=22/sp; nd.vy*=22/sp; }
    nd.x+=nd.vx; nd.y+=nd.vy;
    var pad=nd.r+30;
    nd.x=Math.max(pad,Math.min(W-pad,nd.x));
    nd.y=Math.max(pad+56,Math.min(H-pad-106,nd.y));
    var vis2=nodeVisible(nd);
    var target = !vis2?0 : (focus?[1,.95,.32,.1][Math.min(nd.depth,3)] : (isMine(nd)?1:(nd.kind==="fest"?1:.8)));
    nd.alpha += (target-nd.alpha)*(reduce?1:0.11);
  }
}

var lastT=performance.now();
function draw(now){
  var dt=Math.min((now-lastT)/1000,.05); lastT=now;
  tick();
  ctx.clearRect(0,0,W,H);

  /* Kanten */
  ctx.lineCap="round";
  var i, e;
  for(i=0;i<EDGES.length;i++){
    e=EDGES[i];
    if(!edgeVisible(e)) continue;
    var a=e.a,b=e.b;
    if(a.alpha<0.03||b.alpha<0.03) continue;
    var T=TYPES[e.type];
    var active = focus && (a===focus||b===focus);
    var near = focus && a.depth<=1 && b.depth<=1;
    var hov = !focus && hover && (a===hover||b===hover);
    var alpha, col, lw;
    if(active){ alpha=.92; col=T.c; lw=.8+e.w*.6; }
    else if(near){ alpha=.24; col=T.c; lw=.6+e.w*.2; }
    else if(focus){ continue; }
    else if(hov){ alpha=.8; col=T.c; lw=.8+e.w*.4; }
    else if(e.type==="plays"){ alpha=.055; col="#8E7BAE"; lw=.5; }
    else { alpha=.16; col="#A594BE"; lw=.5+e.w*.1; }
    ctx.globalAlpha=alpha*Math.min(a.alpha,b.alpha);
    ctx.strokeStyle=col; ctx.lineWidth=lw;
    if(e.type==="audience") ctx.setLineDash([3,5]); else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    if(active && !reduce){
      e.p += dt*(0.17+e.w*0.04);
      if(e.p>1) e.p-=1;
      var from=(b===focus)?b:a, to=(b===focus)?a:b;
      var px=from.x+(to.x-from.x)*e.p, py=from.y+(to.y-from.y)*e.p;
      var g=ctx.createRadialGradient(px,py,0,px,py,6.5);
      g.addColorStop(0,T.c); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.globalAlpha=.8; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(px,py,6.5,0,6.284); ctx.fill();
    }
  }
  ctx.setLineDash([]);

  /* Knoten: Peripherie zuerst */
  var order=NODES.slice().sort(function(x,y){
    return (x===focus?3:(x.kind==="fest"?2:(isMine(x)?1:0)))-(y===focus?3:(y.kind==="fest"?2:(isMine(y)?1:0)));
  });
  for(i=0;i<order.length;i++){
    var nd=order[i];
    if(nd.alpha<0.03) continue;
    var isF=nd===focus, isH=nd===hover, mine=isMine(nd);
    var r=nd.r*(isF?1.5:(isH?1.25:1))*(focus&&nd.depth>=3?.6:1);
    var col = nd.kind==="fest" ? "#F0EAF7" : GENRE[nd.g].c;
    ctx.globalAlpha=nd.alpha;

    if(isF||mine||nd.kind==="fest"){
      var gr=ctx.createRadialGradient(nd.x,nd.y,r*.6,nd.x,nd.y,r*(isF?4.6:2.9));
      gr.addColorStop(0, isF?"rgba(255,46,107,.34)":(mine?"rgba(255,46,107,.16)":"rgba(240,234,247,.09)"));
      gr.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(nd.x,nd.y,r*(isF?4.6:2.9),0,6.284); ctx.fill();
    }
    ctx.beginPath();
    if(nd.kind==="fest"){
      ctx.moveTo(nd.x,nd.y-r*1.25); ctx.lineTo(nd.x+r*1.25,nd.y);
      ctx.lineTo(nd.x,nd.y+r*1.25); ctx.lineTo(nd.x-r*1.25,nd.y); ctx.closePath();
    }else{
      ctx.arc(nd.x,nd.y,r,0,6.284);
    }
    ctx.fillStyle = nd.kind==="fest" ? "#221733" : (mine?"#2A1830":"#150E22");
    ctx.fill();
    ctx.lineWidth = isF?3:(mine?2.2:(nd.kind==="fest"?2:1.3));
    ctx.strokeStyle = isF?"#FFFFFF":(mine?"#FF2E6B":col);
    ctx.globalAlpha = nd.alpha*(mine||isF||nd.kind==="fest"?1:.7);
    ctx.stroke();
    if(nd.kind!=="fest"){
      ctx.globalAlpha=nd.alpha*.95;
      ctx.beginPath(); ctx.arc(nd.x,nd.y,Math.max(r*.32,1.8),0,6.284);
      ctx.fillStyle=col; ctx.fill();
    }

    var big = nd.kind==="fest" || isF || isH || mine || (focus&&nd.depth<=1) || (!focus&&nd.deg>13);
    if(big){
      ctx.globalAlpha=nd.alpha*(isF||nd.kind==="fest"?1:(focus&&nd.depth<=1?.95:.72));
      var fs = nd.kind==="fest" ? 17 : (isF?20:(mine?13.5:12.5));
      ctx.font=(nd.kind==="fest"?"900 ":(isF?"900 ":(mine?"700 ":"500 ")))+fs+'px "Big Shoulders Display",sans-serif';
      ctx.textAlign="center"; ctx.textBaseline="top";
      var lbl=nd.name.toUpperCase();
      ctx.lineWidth=3.4; ctx.strokeStyle="rgba(12,8,20,.88)";
      ctx.strokeText(lbl,nd.x,nd.y+r+5);
      ctx.fillStyle = isF?"#FFFFFF":(nd.kind==="fest"?"#F0EAF7":(mine?"#F0EAF7":"#C6B9D8"));
      ctx.fillText(lbl,nd.x,nd.y+r+5);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* =========================================================================
   TEIL 6 — INTERAKTION UND PANEL
   ========================================================================= */

function pick(mx,my){
  var best=null,bd=1e9;
  for(var i=0;i<NODES.length;i++){
    var nd=NODES[i];
    if(nd.alpha<0.15) continue;
    if(focus && nd.depth>=3) continue;
    var d=Math.hypot(nd.x-mx,nd.y-my);
    if(d<Math.max(nd.r+12,18) && d<bd){ bd=d; best=nd; }
  }
  return best;
}
cv.addEventListener("mousemove",function(ev){
  var r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  var p=pick(mx,my);
  hover=p; cv.style.cursor=p?"pointer":"default";
  if(p){
    var h="<b>"+esc(p.name)+"</b>";
    if(p.kind==="fest") h+= p.f.city+" · "+p.acts.length+" Acts im Line-up";
    else{
      h+= GENRE[p.g].n+" · "+p.cc+" · "+p.fests.length+" Festival"+(p.fests.length===1?"":"s");
      h+= isMine(p) ? "<br><span style='color:#FF2E6B'>in deiner Rotation</span>"
                    : (p.score>0?"<br>Nähe zu deiner Auswahl: "+p.score.toFixed(1):"");
    }
    tipEl.innerHTML=h;
    tipEl.style.left=Math.min(mx+16,W-270)+"px";
    tipEl.style.top=Math.max(my-10,60)+"px";
    tipEl.classList.add("on");
  } else tipEl.classList.remove("on");
});
cv.addEventListener("mouseleave",function(){hover=null;tipEl.classList.remove("on");});
cv.addEventListener("click",function(ev){
  var r=cv.getBoundingClientRect();
  var p=pick(ev.clientX-r.left, ev.clientY-r.top);
  if(p) select(p.id);
});
cv.addEventListener("dblclick",function(ev){
  var r=cv.getBoundingClientRect();
  if(!pick(ev.clientX-r.left, ev.clientY-r.top)) select(null);
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){ if(document.activeElement===qEl){ qEl.blur(); hideSugg(); } else select(null); }
});

function select(id){
  if(!id){ focus=null; path=[]; }
  else{
    var nd=byKey[id]; if(!nd) return;
    if(!nodeVisible(nd)){
      if(nd.kind==="fest") showFests=1; else gFilter[nd.g]=1;
      renderRail();
    }
    focus=nd;
    var at=path.indexOf(id);
    if(at>=0) path=path.slice(0,at+1); else path.push(id);
    if(path.length>10) path=path.slice(-10);
  }
  computeDepth(); renderPath(); renderPanel(); updateStat();
  if(window.innerWidth<=960 && id) document.getElementById("panel").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
}

/* ---- Filterleiste ---- */
var railEl=document.getElementById("rail");
function renderRail(){
  var h='<span class="f grp">Genre</span>';
  GKEYS.forEach(function(g){
    var cnt=ARTISTS.filter(function(n){return n.g===g;}).length;
    if(!cnt) return;
    h+='<button class="f'+(gFilter[g]?"":" off")+'" data-g="'+g+'" title="'+GENRE[g].bpm+' BPM · '+cnt+' Acts">'+
       '<span class="dot" style="background:'+GENRE[g].c+'"></span>'+GENRE[g].n+' <span style="opacity:.6">'+cnt+'</span></button>';
  });
  h+='<button class="f'+(coreOnly?"":" off")+'" data-core="1" title="Aus: auch Acts zeigen, die nur einmal auf einem Line-up stehen">'+
     '<span class="dot" style="background:#FF2E6B"></span>nur vernetzter Kern</button>';
  h+='<button class="f'+(showFests?"":" off")+'" data-fest="1" title="Festival-Knoten"><span class="dot" style="background:#F0EAF7;border-radius:0;transform:rotate(45deg)"></span>Festivals '+FESTS.length+'</button>';
  h+='<span class="f grp">Kanten</span>';
  Object.keys(TYPES).forEach(function(t){
    h+='<button class="f'+(eFilter[t]?"":" off")+'" data-e="'+t+'" title="'+TYPES[t].d+'">'+
       '<span class="ln" style="border-top-color:'+TYPES[t].c+'"></span>'+TYPES[t].n+'</button>';
  });
  railEl.innerHTML=h;
  each(railEl.querySelectorAll("[data-g]"),function(b){ b.onclick=function(){ gFilter[b.dataset.g]=!gFilter[b.dataset.g]; afterFilter(); }; });
  each(railEl.querySelectorAll("[data-e]"),function(b){ b.onclick=function(){ eFilter[b.dataset.e]=!eFilter[b.dataset.e]; afterFilter(); }; });
  each(railEl.querySelectorAll("[data-core]"),function(b){ b.onclick=function(){ coreOnly=!coreOnly; afterFilter(); }; });
  each(railEl.querySelectorAll("[data-fest]"),function(b){ b.onclick=function(){ showFests=!showFests; afterFilter(); }; });
}
function afterFilter(){
  computeVis();
  if(focus && !nodeVisible(focus)) select(null);
  else { computeDepth(); renderPanel(); }
  renderRail(); updateStat();
}
function each(list,fn){ Array.prototype.forEach.call(list,fn); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---- Pfad ---- */
var pathEl=document.getElementById("path");
function renderPath(){
  if(!path.length){ pathEl.innerHTML=""; return; }
  var h='<span class="plabel">Pfad</span>';
  path.forEach(function(id,k){
    if(k) h+='<span class="sep">›</span>';
    h+='<button data-go="'+id+'" class="'+(k===path.length-1?"now":"")+'">'+esc(byKey[id].name)+'</button>';
  });
  h+='<button class="reset" data-go="">↺ Übersicht</button>';
  pathEl.innerHTML=h;
  each(pathEl.querySelectorAll("[data-go]"),function(b){ b.onclick=function(){ select(b.dataset.go||null); }; });
}

/* ---- Suche ---- */
var qEl=document.getElementById("q"), suggEl=document.getElementById("sugg"), suggSel=-1, suggList=[];
function hideSugg(){ suggEl.hidden=true; suggSel=-1; }
qEl.addEventListener("input",function(){
  var v=qEl.value.trim().toLowerCase();
  if(v.length<1){ hideSugg(); return; }
  suggList = NODES.filter(function(n){return n.name.toLowerCase().indexOf(v)>=0;})
    .sort(function(x,y){
      var ax=x.name.toLowerCase().indexOf(v), ay=y.name.toLowerCase().indexOf(v);
      return ax-ay || (y.kind==="fest") - (x.kind==="fest") || y.deg-x.deg;
    }).slice(0,14);
  if(!suggList.length){ hideSugg(); return; }
  suggEl.innerHTML = suggList.map(function(n,i){
    var k = n.kind==="fest" ? "Festival" : GENRE[n.g].n;
    return '<button data-i="'+i+'">'+esc(n.name)+'<span class="k">'+k+'</span></button>';
  }).join("");
  each(suggEl.querySelectorAll("button"),function(b){
    b.onclick=function(){ select(suggList[+b.dataset.i].id); qEl.value=""; hideSugg(); };
  });
  suggEl.hidden=false; suggSel=-1;
});
qEl.addEventListener("keydown",function(ev){
  if(suggEl.hidden) return;
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
    ev.preventDefault();
    suggSel += ev.key==="ArrowDown"?1:-1;
    if(suggSel<0) suggSel=suggList.length-1;
    if(suggSel>=suggList.length) suggSel=0;
    each(suggEl.querySelectorAll("button"),function(b,i){ b.classList.toggle("sel",i===suggSel); });
  }else if(ev.key==="Enter"){
    ev.preventDefault();
    var pickIdx = suggSel>=0?suggSel:0;
    if(suggList[pickIdx]){ select(suggList[pickIdx].id); qEl.value=""; hideSugg(); }
  }
});
qEl.addEventListener("blur",function(){ setTimeout(hideSugg,180); });

/* ---- Panel ---- */
var panel=document.getElementById("panel");
function searchLinks(nd){
  return '<div class="links">'+
    '<a href="https://open.spotify.com/search/'+encodeURIComponent(nd.name)+'" target="_blank" rel="noopener">Spotify</a>'+
    '<a href="https://www.youtube.com/results?search_query='+encodeURIComponent(nd.name+" hardcore uptempo")+'" target="_blank" rel="noopener">YouTube</a>'+
    '<a href="https://soundcloud.com/search?q='+encodeURIComponent(nd.name)+'" target="_blank" rel="noopener">SoundCloud</a>'+
    '<a href="https://www.beatport.com/search?q='+encodeURIComponent(nd.name)+'" target="_blank" rel="noopener">Beatport</a></div>';
}
function connRow(nd,e){
  var o=e.a===nd?e.b:e.a, T=TYPES[e.type];
  return '<button class="conn" data-go="'+o.id+'">'+
    '<span class="bar" style="background:'+T.c+';opacity:'+(0.35+e.w*0.13)+'"></span>'+
    '<span class="who">'+esc(o.name)+(isMine(o)?'<span class="mine">DEINE</span>':'')+
      '<br><span class="ttype" style="color:'+T.c+'">'+T.n+'</span></span>'+
    '<span class="str">'+rep(e.w)+'</span>'+
    '<span class="meta">'+esc(e.ev)+'</span></button>';
}
function rep(w){
  var s=""; for(var i=0;i<5;i++) s += i<w ? "▮" : '<span style="opacity:.22">▮</span>';
  return s;
}
function renderPanel(){
  if(!focus) return renderHome();
  if(focus.kind==="fest") return renderFest(focus);
  return renderArtist(focus);
}

function renderArtist(nd){
  var m=nd.meta, G=GENRE[nd.g];
  var conns=nd.edges.filter(function(e){return e.type!=="plays" && edgeVisible(e);})
    .sort(function(x,y){ return (y.w*TYPES[y.type].w)-(x.w*TYPES[x.type].w); });
  var h='';
  h+='<div class="p-head"><span class="eyebrow">'+(isMine(nd)?"In deiner Rotation":(nd.score>0?"Neu für dich · Nähe "+nd.score.toFixed(1):"Act"))+'</span>';
  h+='<h2 class="p-name">'+esc(nd.name)+'</h2>';
  h+='<p class="p-aka">'+esc(m?m.aka:(G.n+" · "+nd.cc))+'</p>';
  h+='<div class="chiprow"><span class="chip dot" style="color:'+G.c+'">'+G.n+'</span>'+
      '<span class="chip">'+nd.cc+'</span>'+
      (G.bpm!=="—"?'<span class="chip">'+G.bpm+' BPM</span>':'')+
      '<span class="chip">'+nd.fests.length+' Festivals</span>'+
      '<span class="chip">'+conns.length+' Verbindungen</span></div>';
  h+='<div class="btnrow" style="margin-top:13px"><button class="btn '+(isMine(nd)?"":"pri")+'" data-mine="'+nd.id+'">'+
      (isMine(nd)?"− aus meiner Rotation":"+ zu meiner Rotation")+'</button></div></div>';

  if(m && m.bio) h+='<div class="sect pad"><h3>Wer das ist</h3><p class="bio">'+esc(m.bio)+'</p></div>';
  else h+='<div class="sect pad"><h3>Datenlage</h3><p class="bio">Zu diesem Act liegt hier kein recherchiertes Profil vor — was du siehst, stammt vollständig aus Line-ups und belegten Releases. Lieber eine dünne Karte als eine erfundene Biografie.</p></div>';

  if(m && m.lb && m.lb.length)
    h+='<div class="sect pad"><h3>Labels</h3><div class="chiprow">'+m.lb.map(function(l){return '<span class="chip">'+esc(l)+'</span>';}).join("")+'</div></div>';

  if(m && m.tr && m.tr.length){
    h+='<div class="sect pad"><h3>Schlüsseltracks</h3><ul class="tracks">';
    m.tr.forEach(function(t){ h+='<li><span class="tt">'+esc(t[0])+'</span><span class="tw">'+esc(t[1])+'</span></li>'; });
    h+='</ul></div>';
  }

  if(nd.fests.length){
    h+='<div class="sect pad"><h3>Bühnen <span class="cnt">'+nd.fests.length+'</span></h3><div class="lineup">';
    nd.fests.forEach(function(f){
      var pe=findEdge(nd,f,"plays");
      h+='<button data-go="'+f.id+'" title="'+esc(pe?pe.stages.join(" · "):"")+'"><span class="g" style="background:#F0EAF7;border-radius:0;transform:rotate(45deg)"></span>'+esc(f.name)+'</button>';
    });
    h+='</div></div>';
  }

  h+='<div class="sect pad"><h3>Verbindungen <span class="cnt">klick zum Weitergraben</span></h3><div class="conns">';
  h+= conns.length ? conns.map(function(e){return connRow(nd,e);}).join("")
                   : '<p class="bio">Keine Verbindungen im aktiven Filter. Blende unten mehr Kantentypen ein.</p>';
  h+='</div></div>';

  var sameFest = ARTISTS.filter(function(o){return o!==nd && sharedFests(nd,o)>=2 && !findBest(nd,o);})
    .sort(function(x,y){return sharedFests(nd,y)-sharedFests(nd,x);}).slice(0,12);
  if(sameFest.length){
    h+='<div class="sect pad"><h3>Teilt Festivals mit <span class="cnt">ohne Track zusammen</span></h3><div class="lineup">';
    sameFest.forEach(function(o){
      h+='<button data-go="'+o.id+'" class="'+(isMine(o)?"is-mine":"")+'"><span class="g" style="background:'+GENRE[o.g].c+'"></span>'+esc(o.name)+' <span style="opacity:.55;font-family:var(--font-mono);font-size:10px">'+sharedFests(nd,o)+'×</span></button>';
    });
    h+='</div></div>';
  }

  h+='<div class="sect pad"><h3>Reinhören</h3>'+searchLinks(nd)+'</div>';
  h+='<div class="pad foot">Kanten der Typen <em>Track zusammen</em>, <em>Gleiches Label</em> und <em>B2B</em> sind über Releases und Line-ups belegt. <em>Hörer-Nähe</em> ist eine begründete Szene-Einschätzung, keine Streaming-Messung.</div>';
  panel.innerHTML=h; panel.scrollTop=0; bind();
}

function renderFest(fn){
  var f=fn.f;
  var mineHere=fn.acts.filter(isMine);
  var h='';
  h+='<div class="p-head"><span class="eyebrow">Festival · '+esc(f.cc)+'</span>';
  h+='<h2 class="p-name">'+esc(f.n)+'</h2>';
  h+='<p class="p-aka">'+esc(f.city)+' · '+esc(f.org)+' · '+esc(f.when)+'</p>';
  h+='<div class="chiprow"><span class="chip">'+esc(f.ed)+'</span><span class="chip">'+fn.acts.length+' Acts</span><span class="chip">'+f.sets.length+' Bühnen erfasst</span>';
  if(mineHere.length) h+='<span class="chip solid">'+mineHere.length+' aus deiner Rotation</span>';
  h+='</div></div>';
  h+='<div class="sect pad"><h3>Was das ist</h3><p class="bio">'+esc(f.note)+'</p></div>';

  h+='<div class="sect pad"><h3>Genre-Mix des Line-ups</h3><div class="chiprow">';
  fn.mix.slice(0,7).forEach(function(m){
    h+='<span class="chip dot" style="color:'+GENRE[m[0]].c+'">'+GENRE[m[0]].n+' '+m[1]+'</span>';
  });
  h+='</div></div>';

  if(mineHere.length){
    h+='<div class="sect pad"><h3>Deine Acts hier</h3><div class="lineup">';
    mineHere.forEach(function(a){ h+='<button class="is-mine" data-go="'+a.id+'"><span class="g" style="background:'+GENRE[a.g].c+'"></span>'+esc(a.name)+'</button>'; });
    h+='</div></div>';
  }

  f.sets.forEach(function(pair){
    var names=[];
    pair[1].forEach(function(rawEntry){
      splitSet(rawEntry).forEach(function(nm){
        var k=key(nm); if(ALIAS[k]) k=key(ALIAS[k]);
        var a=byKey[k];
        if(a && names.indexOf(a)<0) names.push(a);
      });
    });
    if(!names.length) return;
    h+='<div class="sect pad"><h3>'+esc(pair[0])+' <span class="cnt">'+names.length+'</span></h3><div class="lineup">';
    names.forEach(function(a){
      h+='<button data-go="'+a.id+'" class="'+(isMine(a)?"is-mine":"")+'"><span class="g" style="background:'+GENRE[a.g].c+'"></span>'+esc(a.name)+'</button>';
    });
    h+='</div></div>';
  });

  h+='<div class="pad foot">Line-up-Stand: Edition '+esc(f.ed)+'. Gemeinsame Sets („A vs B“) sind im Graph als B2B-Kante zwischen beiden Acts hinterlegt.</div>';
  panel.innerHTML=h; panel.scrollTop=0; bind();
}

function renderHome(){
  var mineNodes=MINE.map(function(k){return byKey[k];}).filter(Boolean);
  var h='';
  h+='<div class="p-head"><span class="eyebrow">'+ARTISTS.length+' Acts · '+FESTS.length+' Festivals · '+EDGES.length+' Kanten</span>';
  h+='<h2 class="p-name">Wähl deine<br>Acts</h2>';
  h+='<p class="p-aka">Die Karte richtet sich nach dir aus: markier, was du hörst, und du bekommst Empfehlungen entlang echter Verbindungen — Tracks, Labels, gemeinsame Sets.</p></div>';

  h+='<div class="sect pad"><h3>Meine Rotation <span class="cnt">'+mineNodes.length+'</span></h3>';
  if(mineNodes.length){
    h+='<div class="mine-list">';
    mineNodes.forEach(function(n){
      h+='<span class="m"><b></b><span>'+esc(n.name)+'</span><button data-mine="'+n.id+'" title="entfernen">×</button></span>';
    });
    h+='</div>';
  }else{
    h+='<p class="bio" style="margin-bottom:10px">Noch nichts ausgewählt. Nimm das Starterpack oder tipp deine Acts ein.</p>';
  }
  h+='<div class="addrow"><input id="addq" placeholder="Act hinzufügen …" autocomplete="off"><button class="btn" id="addbtn">+</button></div>';
  h+='<div class="btnrow" style="margin-top:9px"><button class="btn" id="preset">Uptempo-Starterpack laden</button>';
  if(mineNodes.length) h+='<button class="btn" id="clearmine">leeren</button>';
  h+='</div></div>';

  if(RECS.length){
    h+='<div class="sect pad"><h3>Empfehlungen <span class="cnt">Nähe zu deiner Auswahl</span></h3>';
    RECS.slice(0,14).forEach(function(r,i){
      h+='<button class="rec" data-go="'+r.id+'"><span class="rank">'+(i+1)+'</span>'+
         '<span class="who">'+esc(r.name)+'</span><span class="score">'+r.score.toFixed(1)+'</span>'+
         '<span class="why">'+esc(GENRE[r.g].n)+' · über '+esc(r.via.slice(0,3).join(", ")||"gemeinsame Festivals")+'</span></button>';
    });
    h+='</div>';
  }

  h+='<div class="sect pad"><h3>Meistgespielte Acts <span class="cnt">Festivals hier erfasst</span></h3><table class="tbl">';
  BUSIEST.slice(0,12).forEach(function(a){
    h+='<tr><td><button data-go="'+a.id+'">'+esc(a.name)+'</button><span class="sub">'+esc(GENRE[a.g].n)+' · '+a.cc+'</span></td><td class="n">'+a.fests.length+'</td></tr>';
  });
  h+='</table></div>';

  h+='<div class="sect pad"><h3>Engste Studio-Achsen <span class="cnt">belegte Releases</span></h3><table class="tbl">';
  TOPCOLLAB.slice(0,12).forEach(function(e){
    h+='<tr><td><button data-go="'+e.a.id+'">'+esc(e.a.name)+'</button> <span style="color:var(--ink-3)">×</span> <button data-go="'+e.b.id+'">'+esc(e.b.name)+'</button>'+
       '<span class="sub">'+esc(e.ev.slice(0,74))+'</span></td><td class="n">'+TYPES[e.type].n+'</td></tr>';
  });
  h+='</table></div>';

  h+='<div class="sect pad"><h3>Häufigste B2B-Paarungen <span class="cnt">aus den Line-ups</span></h3><table class="tbl">';
  TOPB2B.slice(0,10).forEach(function(e){
    h+='<tr><td><button data-go="'+e.a.id+'">'+esc(e.a.name)+'</button> <span style="color:var(--ink-3)">vs</span> <button data-go="'+e.b.id+'">'+esc(e.b.name)+'</button>'+
       '<span class="sub">'+esc((e.sets||[]).join(" · ").slice(0,74))+'</span></td><td class="n">'+((e.sets||[]).length)+'×</td></tr>';
  });
  h+='</table></div>';

  h+='<div class="sect pad"><h3>Festivals im Graph <span class="cnt">'+FESTS.length+'</span></h3><div class="fdir">';
  FESTS.slice().sort(function(x,y){return y.acts.length-x.acts.length;}).forEach(function(fn){
    h+='<div class="row live"><span class="nm"><button data-go="'+fn.id+'">'+esc(fn.name)+'</button></span>'+
       '<span class="sub">'+esc(fn.f.city)+' · '+esc(fn.f.when)+'</span>'+
       '<span class="tag">'+fn.acts.length+' Acts</span></div>';
  });
  h+='</div></div>';

  h+='<div class="sect pad"><h3>Weitere Festivals <span class="cnt">ohne Line-up in dieser Datenbank</span></h3><div class="fdir">';
  DIRECTORY.forEach(function(d){
    h+='<div class="row"><span class="nm">'+esc(d[0])+'</span><span class="sub">'+esc(d[2])+'</span><span class="tag">'+esc(d[1].split(", ").pop())+'</span></div>';
  });
  h+='</div></div>';

  h+='<div class="sect pad"><div class="note"><strong>Woher die Daten kommen:</strong> Line-ups von Defqon.1, Dominator, Decibel Outdoor, Intents, Syndicate, Masters of Hardcore, REBiRTH, BKJN, HARDFEST, Toxicator und zwei Club-Reihen — Stand der jeweils genannten Edition. Tracks, Labels und Studio-Achsen aus Release-Daten (Beatport, Discogs, SoundCloud) und Szene-Presse. Gestrichelte <em>Hörer-Nähe</em>-Kanten sind Einschätzung, alles andere ist belegt.</div></div>';
  h+='<div class="pad foot">Kein Anspruch auf Vollständigkeit: eine vollständige Diskografie aller Acts wäre ein Datenbankprojekt, kein Artefakt. Was hier steht, ist überprüfbar — und deine Auswahl bleibt lokal in deinem Browser.</div>';

  panel.innerHTML=h; panel.scrollTop=0; bind();

  var addq=document.getElementById("addq"), addbtn=document.getElementById("addbtn");
  function addFromInput(){
    var v=(addq.value||"").trim().toLowerCase();
    if(!v) return;
    var hit=ARTISTS.filter(function(n){return n.name.toLowerCase().indexOf(v)>=0;})
      .sort(function(x,y){return x.name.length-y.name.length;})[0];
    if(hit && !isMine(hit)){ MINE.push(hit.id); saveMine(); score(); renderPanel(); }
    addq.value="";
  }
  if(addbtn) addbtn.onclick=addFromInput;
  if(addq) addq.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); addFromInput(); } };
  var pb=document.getElementById("preset");
  if(pb) pb.onclick=function(){
    PRESET.forEach(function(nm){ var k=key(nm); if(byKey[k] && MINE.indexOf(k)<0) MINE.push(k); });
    saveMine(); score(); renderPanel();
  };
  var cb=document.getElementById("clearmine");
  if(cb) cb.onclick=function(){ MINE=[]; saveMine(); score(); renderPanel(); };
}

function bind(){
  each(panel.querySelectorAll("[data-go]"),function(b){ b.onclick=function(){ select(b.dataset.go); }; });
  each(panel.querySelectorAll("[data-mine]"),function(b){ b.onclick=function(){ toggleMine(byKey[b.dataset.mine]); }; });
}

function updateStat(){
  var shown=VIS.filter(function(n){return n.kind==="artist";}).length;
  document.getElementById("stat").textContent =
    shown+" von "+ARTISTS.length+" Acts · "+FESTS.length+" Festivals · "+EDGES.length+" Verbindungen";
}
renderRail(); computeDepth(); renderPath(); renderPanel(); updateStat();
})();
</script>

</body>
</html>
